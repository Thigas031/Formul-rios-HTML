<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>

<body>
    <header>
        <h1>Formulario Básico</h1>

        <input
        id="pesquisa"
        type="search"
        placeholder="pesquisar">

    </header>
    <form>
        <section class="card">

            <h2>Foto de Perfil</h2>

            <div class="envio">

                <div class="preview">

                    <img src="img/Perfil.png" alt="Foto de Perfil">

                </div>

                <div class="upload-info">

                    <label for="foto">
                        Enviar Imagem
                    </label>

                    <input
                    type="file"
                    id="foto"
                    accept=".jpg, .jpeg, .png">

                    <p>JPG, PNG de até 5 MB</p>

                </div>

            </div>
        </section>

        <section class="card">
            <h2>Informações Pessoais</h2>
            <div class="linha">
                <div class="campo">
                    <label for="nome">
                        Primeiro Nome*
                    </label>

                    <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Insira seu primeiro nome"
                    required>
                </div>

                <div class="campo">
                    <label for="sobrenome">
                        Segundo Nome*
                    </label>

                    <input
                    type="text"
                    id="sobrenome"
                    name="sobrenome"
                    placeholder="Insira seu segundo nome"
                    required>
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="email">
                        Endereço de E-mail*
                    </label>

                    <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Insira seu endereço de email"
                    required>
                </div>
                <div class="telefone">
                    <label for="telefone">
                        Numero de Telefone*
                    </label>
                    <div class="tel-input">
                        <span>+55</span>
                        <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="Insira seu número de telefone"
                        required>
                    </div>
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="senha">
                        Senha*
                    </label>
                    <input
                    type="password"
                    id="senha" 
                    name="senha"
                    placeholder="Crie uma senha"
                    required
                    minlength="8">
                </div>

                <div class="campo">
                    <label>
                        Gênero*
                    </label>

                    <div class="grupo-radio">
                        <div class="item-radio">

                            <input
                            type="radio"
                            id="masculino"
                            name="genero"
                            value="masculino"
                            required>

                            <label for="masculino">
                                Masculino
                            </label>
                        </div>

                        <div class="item-radio">

                            <input
                            type="radio"
                            id="feminino"
                            name="genero"
                            value="feminino"
                            required>

                            <label for="feminino">
                                Feminino
                            </label>
                        </div>

                        <div class="item-radio">

                            <input
                            type="radio"
                            id="outro"
                            name="genero"
                            value="outro"
                            required>

                            <label for="outro">
                                Outro
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="nascimento">
                        Data de Nascimento
                    </label>
                    <input
                    type="date"
                    id="nascimento"
                    name="nascimento"
                    min="1900-01-01"
                    required>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>Outros Tipos de Inputs</h2>
            <h3>Interesses</h3>

            <input
            type="checkbox"
            id="html"
            name="interesses"
            value="html">

            <label for="html">
                HTML
            </label>

            <br>

            <input
            type="checkbox"
            id="css"
            name="interesses"
            value="css">

            <label for="css">
                CSS
            </label>

            <br><br>

            <label for="satisfacao">
                Satisfação
            </label>

            <br>

            <input
            type="range"
            id="satisfacao"
            name="satisfacao"
            min="0"
            max="10"
            value="5">

            <br><br>

            <label for="cor">
                Cor Favorita
            </label>

            <br>

            <input
            type="color"
            id="cor"
            name="cor"
            value="royalblue">

            <br><br>

            <label for="numero">
                Quantidade
            </label>

            <br>

            <input
            type="number"
            name="quantidade"
            id="numero"
            min="1"
            max="100"
            value="1"
            step="1">
        </section>

        <div class="botoes">
            <button
            type="reset"
            class="bnt-limpar">
                Limpar
            </button>

            <button
            type="submit"
            class="bnt-enviar">
                Enviar
            </button>
        </div>
    </form>
</body>
</html>
